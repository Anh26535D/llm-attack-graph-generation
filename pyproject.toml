[project]
name = "crystalball-attack-graph"
version = "0.1.0"
description = "Reproduction of 'Using Retriever Augmented Large Language Models for Attack Graph Generation' (arXiv:2408.05855)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0", "torch>=2.0"]
openai = ["openai>=1.30"]
gemini = ["google-generativeai>=0.5"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crystalball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
