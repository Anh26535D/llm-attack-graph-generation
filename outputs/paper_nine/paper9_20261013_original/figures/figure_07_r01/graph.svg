<g class="edge-label" data-i="0"><rect x="721.24" y="794.07" width="264.00" height="173.00" fill="white" opacity=".92"/>
<text x="853.24" y="817.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Arbitrary file download enables</text>
<text x="853.24" y="840.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">reading local application</text>
<text x="853.24" y="863.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">secrets, web configurations,</text>
<text x="853.24" y="886.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">and credential stores,</text>
<text x="853.24" y="909.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">satisfying the authenticated</text>
<text x="853.24" y="932.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">access requirement of the</text>
<text x="853.24" y="955.57" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">RaspAP web interface.</text>
</g>
<g class="edge-label" data-i="1"><rect x="858.40" y="446.00" width="245.00" height="196.00" fill="white" opacity=".92"/>
<text x="980.90" y="469.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Path traversal file download</text>
<text x="980.90" y="492.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">enables reading system files</text>
<text x="980.90" y="515.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">(e.g., /etc/passwd or</text>
<text x="980.90" y="538.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">/etc/shadow) to verify the</text>
<text x="980.90" y="561.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">existence of the default &#x27;pi&#x27;</text>
<text x="980.90" y="584.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">account and validate</text>
<text x="980.90" y="607.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">unhashed/unmodified</text>
<text x="980.90" y="630.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">credentials.</text>
</g>
<g class="edge-label" data-i="2"><rect x="576.58" y="528.41" width="280.00" height="196.00" fill="white" opacity=".92"/>
<text x="716.58" y="551.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Administrator privileges</text>
<text x="716.58" y="574.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">obtained via default OS</text>
<text x="716.58" y="597.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">credentials allow reading</text>
<text x="716.58" y="620.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">RaspAP database configurations</text>
<text x="716.58" y="643.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">or modifying web authentication</text>
<text x="716.58" y="666.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">tables, providing valid</text>
<text x="716.58" y="689.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">authentication for the RaspAP</text>
<text x="716.58" y="712.91" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">web console.</text>
</g>
<g class="edge-label" data-i="3"><rect x="400.06" y="280.00" width="255.00" height="196.00" fill="white" opacity=".92"/>
<text x="527.56" y="303.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Administrative shell access</text>
<text x="527.56" y="326.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">allows the attacker to execute</text>
<text x="527.56" y="349.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">programs that play audio</text>
<text x="527.56" y="372.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">through connected speakers</text>
<text x="527.56" y="395.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">powered by the Raspberry Pi,</text>
<text x="527.56" y="418.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">creating the fluctuating</text>
<text x="527.56" y="441.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">acoustic load necessary for</text>
<text x="527.56" y="464.50" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">optical signal recovery.</text>
</g>
<g class="edge-label" data-i="4"><rect x="277.07" y="670.83" width="287.00" height="173.00" fill="white" opacity=".92"/>
<text x="420.57" y="694.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">OS command execution achieved</text>
<text x="420.57" y="717.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">via the web console allows</text>
<text x="420.57" y="740.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">triggering audio playback to</text>
<text x="420.57" y="763.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">connected equipment, generating</text>
<text x="420.57" y="786.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">power consumption variations</text>
<text x="420.57" y="809.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">recoverable via the</text>
<text x="420.57" y="832.33" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">electro-optical sensor.</text>
</g>
<g class="edge-label" data-i="5"><rect x="1897.37" y="351.71" width="261.00" height="196.00" fill="white" opacity=".92"/>
<text x="2027.87" y="375.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Local unprivileged code</text>
<text x="2027.87" y="398.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">execution achieved via Oculus</text>
<text x="2027.87" y="421.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Browser UI exploitation allows</text>
<text x="2027.87" y="444.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">an attacker to create hard</text>
<text x="2027.87" y="467.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">links targeting the log file</text>
<text x="2027.87" y="490.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">used by OVRRedir.exe,</text>
<text x="2027.87" y="513.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">triggering privileged arbitrary</text>
<text x="2027.87" y="536.21" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">file writes.</text>
</g>
<g class="edge-label" data-i="6"><rect x="1499.26" y="610.42" width="270.00" height="196.00" fill="white" opacity=".92"/>
<text x="1634.26" y="633.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Local unprivileged process</text>
<text x="1634.26" y="656.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">execution resulting from Oculus</text>
<text x="1634.26" y="679.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">Browser exploitation allows</text>
<text x="1634.26" y="702.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">interacting with</text>
<text x="1634.26" y="725.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">OVRServiceLauncher.exe to</text>
<text x="1634.26" y="748.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">capture leaked privileged</text>
<text x="1634.26" y="771.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">process handles, achieving</text>
<text x="1634.26" y="794.92" text-anchor="middle" font-family="Arial" font-size="18" fill="#bf3434">SYSTEM privileges.</text>
</g>
</svg>