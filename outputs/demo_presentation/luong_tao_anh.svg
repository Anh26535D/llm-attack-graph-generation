   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'Arial'; text-anchor: start; fill: #173554" x="51.84" y="57.940781" transform="rotate(-0 51.84 57.940781)">Luồng tạo ảnh trong một lần demo</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'Arial'; text-anchor: start; fill: #526980" x="51.84" y="81.824438" transform="rotate(-0 51.84 81.824438)">LLM tạo nút và cạnh; Python tính bố cục và vẽ hình từ JSON</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial'; text-anchor: middle; fill: #173554" x="201.6" y="201.677594" transform="rotate(-0 201.6 201.677594)">1. Chọn dữ liệu</text>
   </g>
   <g id="text_4">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(124.638984 239.941785)">CVE context hoặc báo cáo</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(144.129844 257.752293)">Giữ thông tin nguồn</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial'; text-anchor: middle; fill: #173554" x="576" y="201.585953" transform="rotate(-0 576 201.585953)">2. Tạo prompt</text>
   </g>
   <g id="text_6">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(500.495391 239.609676)">Instruction quy định JSON</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(510.595781 256.685887)">Ghép nội dung context</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial'; text-anchor: middle; fill: #173554" x="950.4" y="201.677594" transform="rotate(-0 950.4 201.677594)">3. Gọi LLM</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(894.750859 239.605613)">Sinh nodes / edges</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(901.609375 256.68284)">Lưu response.txt</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial'; text-anchor: middle; fill: #173554" x="950.4" y="405.633531" transform="rotate(-0 950.4 405.633531)">4. Parse + kiểm tra</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(868.033828 440.565848)">JSON, schema, ID, endpoint</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(872.155234 457.486668)">Lưu graph.json + metadata</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial'; text-anchor: middle; fill: #173554" x="576" y="405.512672" transform="rotate(-0 576 405.512672)">5. Bố trí và vẽ</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(507.36 440.406395)">NetworkX spring_layout</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(510.047344 457.565887)">Matplotlib + dựng SVG</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 17px; font-family: 'Arial'; text-anchor: middle; fill: #173554" x="201.6" y="403.827281" transform="rotate(-0 201.6 403.827281)">6. Xuất và trình bày</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(124.650156 440.933504)">PNG / SVG: báo cáo, slide</text>
    <text style="font-size: 13px; font-family: 'Arial'; fill: #526980" transform="translate(134.106641 457.512059)">HTML: demo tương tác</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Arial'; text-anchor: start; fill: #173554" x="51.84" y="541.08" transform="rotate(-0 51.84 541.08)">Replay: đọc response.txt đã lưu rồi thực hiện bước 4 → 5 → 6, không gọi API.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 13px; font-family: 'Arial'; text-anchor: start; fill: #526980" x="51.84" y="576.072" transform="rotate(-0 51.84 576.072)">Renderer kiểm tra ID và endpoint; không tự thêm quan hệ để nối các cụm graph.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 13px; font-family: 'Arial'; text-anchor: start; fill: #526980" x="51.84" y="605.88" transform="rotate(-0 51.84 605.88)">Khi trình bày kết quả: ghi run, mode, model và cảnh báo; đối chiếu cạnh với nguồn.</text>
   </g>
  </g>
